{% extends "base.html" %}

{% block title %}Reporte de Consumo y Rendimiento{% endblock %}

{% block content %}

<div class="card border-0 shadow p-4" style="border-radius:12px;">

    <!-- Encabezado -->
    <div class="d-flex align-items-center mb-4 pb-2 border-bottom">

        <div class="bg-primary bg-opacity-10 p-2 rounded-3 me-3">
            <i class="bi bi-speedometer2 text-primary fs-4"></i>
        </div>

        <h5 class="fw-bold mb-0">
            Reporte de Consumo y Rendimiento
        </h5>

    </div>


    <form method="GET" action="{{ url_for('reporte_rendimientos') }}" class="row g-3 align-items-end">

        <!-- Proyecto -->
        <div class="col-xl-3 col-md-6">
            <label class="form-label fw-bold small text-uppercase text-muted">Proyecto</label>
            <div class="input-group shadow-sm-hover">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-building border-end-2"></i>
                </span>
                <select name="proyecto" class="form-select border-start-0 ps-1 text-dark">
                    <option value="">Todos los proyectos</option>
                    {% for p in proyectos %}
                    <option value="{{ p.id }}">{{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Vehículo -->
        <div class="col-xl-3 col-md-6">
            <label class="form-label fw-bold small text-uppercase text-muted">Vehículo</label>
            <div class="input-group shadow-sm-hover">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-truck"></i>
                </span>

                <select name="vehiculo" class="form-select border-start-0 ps-1 text-dark">
                    <option value="">Todos los vehículos</option>
                    {% for v in vehiculos %}
                    <option value="{{ v.id }}">{{ v.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Fecha Inicial -->
        <div class="col-xl-2 col-md-6">
            <label class="form-label fw-bold small text-uppercase text-muted">Fecha Inicio</label>
            <div class="input-group shadow-sm-hover">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-calendar3"></i>
                </span>
                <input type="date" name="inicio" class="form-control border-start-0 ps-1 text-dark">
            </div>
        </div>

        <!-- Fecha Final -->
        <div class="col-xl-2 col-md-6">
            <label class="form-label fw-bold small text-uppercase text-muted">Fecha Fin</label>
            <div class="input-group shadow-sm-hover">
                <span class="input-group-text bg-light border-end-0">
                    <i class="bi bi-calendar3"></i>
                </span>
                <input type="date" name="fin" class="form-control border-start-0 ps-1 text-dark">
            </div>
        </div>

        <!-- Botón de Acción -->
        <div class="col-xl-2 col-md-12">
            <button type="submit"
                class="btn btn-success w-100 fw-bold d-inline-flex align-items-center justify-content-center gap-2 py-2 shadow-sm transition-base">
                <i class="bi bi-filetype-xls fs-5"></i>
                Exportar Excel
            </button>
        </div>

    </form>


</div>

{% endblock %}
